[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam-agent"
version = "0.1.0"
description = "Authorization kernel for explicitly authorized red-team exercises"
requires-python = ">=3.12,<3.15"
dependencies = [
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "coverage==7.16.0",
  "hypothesis==6.165.10",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
strict_markers = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["redteam_agent"]

[tool.coverage.run]
branch = true
source = ["redteam_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false
