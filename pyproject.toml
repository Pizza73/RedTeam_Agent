[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam-agent"
version = "0.0.0a1"
description = "Authorization kernel for an authorized, isolated red-team exercise support agent (Phase 0A)."
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.4"]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.140.3",
    "coverage==7.11.0",
    "ruff==0.14.5",
    "mypy==1.18.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # asserts are used in tests and as internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501", "RUF059"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["redteam_agent"]
warn_unused_ignores = false
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.coverage.run]
branch = true
source = ["redteam_agent"]

[tool.coverage.report]
show_missing = true
