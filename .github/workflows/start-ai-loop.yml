name: Start AI Loop

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number for the long-lived AI loop
        required: true
        type: number
      head_sha:
        description: Exact 40-character Phase 0A starting SHA
        required: true
        type: string
      confirmation:
        description: Type START_PHASE_0A
        required: true
        type: string

concurrency:
  group: redteam-start-${{ inputs.pull_request_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_GATE_APPROVER_LOGIN: ${{ vars.AI_GATE_APPROVER_LOGIN }}
      CONFIRMATION: ${{ inputs.confirmation }}
      HEAD_SHA: ${{ inputs.head_sha }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
    steps:
      - name: Validate Phase 0A start and issue implementation request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            if (process.env.CONFIRMATION !== 'START_PHASE_0A') {
              core.setFailed('Confirmation text does not match.');
              return;
            }
            if (!process.env.AI_GATE_APPROVER_LOGIN || context.actor !== process.env.AI_GATE_APPROVER_LOGIN) {
              core.setFailed(`Untrusted AI-loop start actor: ${context.actor}`);
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number.parseInt(process.env.PR_NUMBER, 10);
            const headSha = process.env.HEAD_SHA.trim();
            if (!Number.isInteger(pull_number) || pull_number < 1 || !/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('Pull request number or head SHA is invalid.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({owner, repo, pull_number});
            if (pr.state !== 'open' || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('The AI loop requires an open same-repository pull request.');
              return;
            }
            if (pr.base.ref !== context.payload.repository.default_branch || pr.head.sha !== headSha) {
              core.setFailed('Pull request base or current head SHA does not match the requested start.');
              return;
            }
            const labels = pr.labels.map((item) => item.name);
            const phases = labels.filter((name) => /^phase-(0a|0b|0c|[1-5])$/.test(name));
            if (!labels.includes('ai-loop') || phases.length !== 1 || phases[0] !== 'phase-0a') {
              core.setFailed('The pull request must have ai-loop and exactly one phase-0a label.');
              return;
            }

            const { data: planFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'automation/phase-plan.json',
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(planFile) || planFile.type !== 'file' || !planFile.content) {
              core.setFailed('Trusted phase plan is unavailable.');
              return;
            }
            let plan;
            try {
              plan = JSON.parse(Buffer.from(planFile.content, 'base64').toString('utf8'));
            } catch (_) {
              core.setFailed('Trusted phase plan is invalid JSON.');
              return;
            }
            const phaseConfig = plan.phases?.[0];
            if (
              plan.schema_version !== '1.0' ||
              phaseConfig?.id !== 'phase-0a' ||
              phaseConfig.label !== 'phase-0a' ||
              phaseConfig.auto_start !== true ||
              typeof phaseConfig.prompt !== 'string'
            ) {
              core.setFailed('Trusted Phase 0A configuration is invalid.');
              return;
            }

            const request = {
              schema_version: '1.0',
              action: 'IMPLEMENT_PHASE',
              trigger: 'PHASE_START',
              phase: 'phase-0a',
              head_sha: headSha,
              phase_prompt: phaseConfig.prompt,
              invariant_audit: plan.invariant_audit,
            };
            const marker = `<!-- redteam-implementation-request\n${JSON.stringify(request)}\n-->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const trustedDuplicate = comments.some(
              (item) => item.user?.login === 'github-actions[bot]' && item.body?.includes(marker)
            );
            if (!trustedDuplicate) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `Phase 0A implementation is authorized for \`${headSha}\`. The local phase orchestrator will request the Codex implementation; restart it if polling is paused. No AI API runs in GitHub Actions.\n\n${marker}`,
              });
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pull_number, labels: ['ai-needs-implementation'],
            });
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: 'pending',
              context: 'redteam/phase-review',
              description: 'phase-0a: implementation pending',
            });
