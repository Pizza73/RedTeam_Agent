name: RedTeam Agent CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: redteam-ci-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: governance-integrity
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Reject AI self-modification of governance
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          git diff --name-only -z \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | python scripts/ci/check_governance.py --labels-json "$PR_LABELS_JSON"

  tests:
    name: tests (${{ matrix.python-version }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Run governance bootstrap tests
        if: >-
          contains(github.event.pull_request.labels.*.name, 'governance-change') &&
          !contains(github.event.pull_request.labels.*.name, 'ai-loop')
        shell: bash
        run: |
          python -m pytest -q \
            tests/unit/test_automation_validation.py \
            tests/unit/test_governance_check.py \
            tests/unit/test_phase_loop.py \
            --strict-markers
      - name: Run application tests
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'governance-change') ||
          contains(github.event.pull_request.labels.*.name, 'ai-loop')
        shell: bash
        run: |
          python -m pytest -q tests/unit --strict-markers
          python -m pytest -q tests/integration --strict-markers
          python -m pytest -q tests/security --strict-markers

  quality:
    name: quality
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Resolve current phase
        id: phase
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((item) => item.name);
            const phases = labels.filter((name) => /^phase-(0a|0b|0c|[1-5])$/.test(name));
            if (labels.includes('governance-change') && !labels.includes('ai-loop') && phases.length === 0) {
              core.setOutput('phase', 'phase-0a');
              core.setOutput('mode', 'governance');
              return;
            }
            if (!labels.includes('ai-loop') || phases.length !== 1) {
              core.setFailed(`Exactly one phase label is required, got: ${phases.join(', ')}`);
              return;
            }
            core.setOutput('phase', phases[0]);
            core.setOutput('mode', 'phase');
      - name: Validate governance bootstrap
        if: steps.phase.outputs.mode == 'governance'
        shell: bash
        run: |
          python -m compileall -q automation scripts/ci
          python scripts/ci/validate_automation.py
          python -m ruff check \
            automation \
            scripts/ci \
            tests/unit/test_automation_validation.py \
            tests/unit/test_governance_check.py \
            tests/unit/test_phase_loop.py
      - name: Run complete phase gate
        if: steps.phase.outputs.mode == 'phase'
        shell: bash
        run: bash scripts/ci/run_phase_gate.sh "${{ steps.phase.outputs.phase }}"

  governance_review_status:
    name: governance-review-status
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'governance-change') &&
      !contains(github.event.pull_request.labels.*.name, 'ai-loop')
    needs: [governance, tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Mark AI phase review not applicable to governance PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const results = Object.values(JSON.parse(process.env.NEEDS_JSON)).map(
              (item) => item.result
            );
            const passed = results.every((result) => result === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: passed ? 'success' : 'error',
              context: 'redteam/phase-review',
              description: passed
                ? 'not applicable: human-reviewed governance change'
                : 'governance deterministic checks failed',
            });
            if (!passed) core.setFailed(`Governance checks failed: ${results.join(', ')}`);

  review_ready:
    name: review-ready
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai-loop')
    needs: [governance, tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Post SHA-bound review request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((item) => item.name);
            const phases = labels.filter((name) => /^phase-(0a|0b|0c|[1-5])$/.test(name));
            if (phases.length !== 1) {
              core.setFailed(`Exactly one phase label is required, got: ${phases.join(', ')}`);
              return;
            }
            const payload = {
              schema_version: '1.0',
              phase: phases[0],
              head_sha: pr.head.sha,
            };
            const marker = `<!-- redteam-ready-for-review\n${JSON.stringify(payload)}\n-->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const markerExists = comments.some(
              (item) => item.user?.login === 'github-actions[bot]' && item.body?.includes(marker)
            );
            for (const name of ['ai-needs-implementation', 'ai-needs-fix']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['ai-needs-review'],
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: 'pending',
              context: 'redteam/phase-review',
              description: `${phases[0]}: independent review pending`.slice(0, 140),
            });
            if (markerExists) {
              core.info('Review-ready marker already exists for this phase and SHA.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `CI passed for \`${phases[0]}\` at \`${pr.head.sha}\`. The local phase orchestrator will request a fresh SHA-bound Codex review and record validated evidence; restart it if polling is paused.\n\n${marker}`,
              });
            }

  ci_failure:
    name: ci-failure-handoff
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai-loop') &&
      (needs.governance.result != 'success' || needs.tests.result != 'success' || needs.quality.result != 'success')
    needs: [governance, tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    env:
      AI_LOOP_MAX_ITERATIONS: ${{ vars.AI_LOOP_MAX_ITERATIONS }}
      GOVERNANCE_RESULT: ${{ needs.governance.result }}
    steps:
      - name: Hand CI failure to Codex with bounded retries
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labels = pr.labels.map((item) => item.name);
            const phases = labels.filter((name) => /^phase-(0a|0b|0c|[1-5])$/.test(name));
            if (phases.length !== 1) {
              core.setFailed(`Exactly one phase label is required, got: ${phases.join(', ')}`);
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pr.head.sha,
              state: 'error',
              context: 'redteam/phase-review',
              description: `${phases[0]}: CI or governance gate failed`.slice(0, 140),
            });
            if (process.env.GOVERNANCE_RESULT !== 'success') {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['ai-loop-blocked'],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `AI loop blocked: the governance-integrity check failed for \`${phases[0]}\` at \`${pr.head.sha}\`. Move protected changes to a separate human-reviewed governance pull request.`,
              });
              return;
            }
            const { data: planFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'automation/phase-plan.json',
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(planFile) || planFile.type !== 'file' || !planFile.content) {
              core.setFailed('Trusted phase plan is unavailable.');
              return;
            }
            const plan = JSON.parse(Buffer.from(planFile.content, 'base64').toString('utf8'));
            const phaseConfig = plan.phases.find((item) => item.id === phases[0]);
            if (!phaseConfig) {
              core.setFailed(`Unknown phase: ${phases[0]}`);
              return;
            }
            const requestPattern = /<!--\s*redteam-implementation-request\s*([\s\S]*?)-->/;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            let attempts = 0;
            let phaseAuthorized = false;
            for (const comment of comments) {
              if (comment.user?.login !== 'github-actions[bot]') continue;
              const match = comment.body?.match(requestPattern);
              if (!match) continue;
              try {
                const prior = JSON.parse(match[1].trim());
                const isTrustedPhaseRequest =
                  prior.schema_version === '1.0' &&
                  prior.phase === phases[0] &&
                  prior.phase_prompt === phaseConfig.prompt &&
                  ['IMPLEMENT_PHASE', 'FIX_REVIEW_FINDINGS'].includes(prior.action);
                if (!isTrustedPhaseRequest) continue;
                phaseAuthorized = true;
                if (prior.trigger === 'CI_FAILURE') attempts += 1;
              } catch (_) {}
            }
            if (!phaseAuthorized) {
              core.notice('No trusted phase request exists yet; Start AI Loop must authorize it.');
              return;
            }
            const maximum = Number.parseInt(process.env.AI_LOOP_MAX_ITERATIONS || '5', 10);
            if (!Number.isInteger(maximum) || maximum < 1 || maximum > 20) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['ai-loop-blocked'],
              });
              core.setFailed('AI_LOOP_MAX_ITERATIONS must be an integer from 1 through 20.');
              return;
            }
            if (attempts >= maximum) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['ai-loop-blocked'],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `AI loop stopped: CI failed ${attempts} times for \`${phases[0]}\` (limit ${maximum}).`,
              });
              return;
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.number, labels: ['ai-needs-fix'],
            });
            const request = {
              schema_version: '1.0',
              action: 'IMPLEMENT_PHASE',
              trigger: 'CI_FAILURE',
              phase: phases[0],
              head_sha: pr.head.sha,
              phase_prompt: phaseConfig.prompt,
            };
            const marker = `<!-- redteam-implementation-request\n${JSON.stringify(request)}\n-->`;
            if (comments.some(
              (item) => item.user?.login === 'github-actions[bot]' && item.body?.includes(marker)
            )) {
              core.info('CI failure handoff already exists for this phase and SHA.');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `CI or governance validation failed for \`${phases[0]}\` at \`${pr.head.sha}\`. The local phase orchestrator will request the bounded Codex fix; restart it if polling is paused. No AI API runs in GitHub Actions.\n\n${marker}`,
            });
