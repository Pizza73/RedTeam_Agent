name: Bootstrap AI Loop Labels

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BOOTSTRAP_AI_LOOP
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_GATE_APPROVER_LOGIN: ${{ vars.AI_GATE_APPROVER_LOGIN }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Create missing AI loop labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            if (process.env.CONFIRMATION !== 'BOOTSTRAP_AI_LOOP') {
              core.setFailed('Confirmation text does not match.');
              return;
            }
            if (!process.env.AI_GATE_APPROVER_LOGIN || context.actor !== process.env.AI_GATE_APPROVER_LOGIN) {
              core.setFailed(`Untrusted bootstrap actor: ${context.actor}`);
              return;
            }
            const definitions = [
              ['ai-loop', '1d76db', 'Bounded SystemDesign implementation loop'],
              ['ai-needs-implementation', 'fbca04', 'Local loop must request Codex implementation'],
              ['ai-needs-review', '5319e7', 'CI passed; independent AI review required'],
              ['ai-needs-fix', 'd93f0b', 'CI or independent review requires a fix'],
              ['ai-review-passed', '0e8a16', 'Current phase has a trusted PASS record'],
              ['ai-loop-blocked', 'b60205', 'AI loop stopped fail closed'],
              ['ai-human-gate', 'd4c5f9', 'Explicit provider or product decision required'],
              ['ai-project-complete', '006b75', 'All phase gates passed; local exact-SHA merge gate pending'],
              ['governance-change', 'c5def5', 'Human-reviewed change to protected control files'],
              ['phase-0a', 'bfdadc', 'Core Models and Authorization Kernel'],
              ['phase-0b', 'bfdadc', 'Execution Safety'],
              ['phase-0c', 'bfdadc', 'Data Security and Audit'],
              ['phase-1', 'bfdadc', 'Agent Loop with mocks'],
              ['phase-2', 'bfdadc', 'Local LLM'],
              ['phase-3', 'bfdadc', 'Human Approval and Durable Resume'],
              ['phase-4', 'bfdadc', 'Approved C2 Adapter'],
              ['phase-5', 'bfdadc', 'Approved MCP Adapter'],
            ];
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const names = new Set(existing.map((item) => item.name));
            for (const [name, color, description] of definitions) {
              if (names.has(name)) {
                core.info(`Label already exists: ${name}`);
                continue;
              }
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color,
                description,
              });
            }
