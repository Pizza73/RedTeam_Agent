name: Resume AI Loop

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Blocked AI-loop pull request number
        required: true
        type: number
      head_sha:
        description: Exact current 40-character PR head SHA
        required: true
        type: string
      resolution_reference:
        description: GitHub permalink documenting the resolved blocker
        required: true
        type: string
      resolution_summary:
        description: Concise resolution summary with no secrets
        required: true
        type: string
      confirmation:
        description: Type RESUME_AI_LOOP
        required: true
        type: string

concurrency:
  group: redteam-resume-${{ inputs.pull_request_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_GATE_APPROVER_LOGIN: ${{ vars.AI_GATE_APPROVER_LOGIN }}
      CONFIRMATION: ${{ inputs.confirmation }}
      HEAD_SHA: ${{ inputs.head_sha }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      RESOLUTION_REFERENCE: ${{ inputs.resolution_reference }}
      RESOLUTION_SUMMARY: ${{ inputs.resolution_summary }}
    steps:
      - name: Check out trusted evidence parser
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate resolution and issue bounded resume request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const path = require('path');
            const {markerPayloads} = require(path.join(
              process.env.GITHUB_WORKSPACE, 'automation', 'approve_design_resume.js'
            ));
            if (process.env.CONFIRMATION !== 'RESUME_AI_LOOP') {
              core.setFailed('Confirmation text does not match.');
              return;
            }
            if (!process.env.AI_GATE_APPROVER_LOGIN || context.actor !== process.env.AI_GATE_APPROVER_LOGIN) {
              core.setFailed(`Untrusted AI-loop resume actor: ${context.actor}`);
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number.parseInt(process.env.PR_NUMBER, 10);
            const headSha = process.env.HEAD_SHA.trim();
            const resolutionReference = process.env.RESOLUTION_REFERENCE.trim();
            const resolutionSummary = process.env.RESOLUTION_SUMMARY.trim();
            if (!Number.isInteger(pull_number) || pull_number < 1 || !/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('Pull request number or head SHA is invalid.');
              return;
            }
            if (!resolutionSummary || resolutionSummary.length > 500 || resolutionSummary.includes('-->')) {
              core.setFailed('Resolution summary must be 1-500 characters and marker-safe.');
              return;
            }
            const expectedReferencePrefix = `https://github.com/${owner}/${repo}/`;
            if (!resolutionReference.startsWith(expectedReferencePrefix)) {
              core.setFailed('Resolution reference must be a permalink in this repository.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({owner, repo, pull_number});
            if (
              pr.state !== 'open' ||
              pr.head.repo.full_name !== `${owner}/${repo}` ||
              pr.base.ref !== context.payload.repository.default_branch ||
              pr.head.sha !== headSha
            ) {
              core.setFailed('The current pull request state does not match the resume request.');
              return;
            }
            const labels = pr.labels.map((item) => item.name);
            const phases = labels.filter((name) => /^phase-(0a|0b|0c|[1-5])$/.test(name));
            if (
              !labels.includes('ai-loop') ||
              !labels.includes('ai-loop-blocked') ||
              phases.length !== 1
            ) {
              core.setFailed('The pull request is not a blocked AI loop with exactly one phase.');
              return;
            }
            const phase = phases[0];
            if (phase === 'phase-4' || phase === 'phase-5') {
              core.setFailed('Phase 4 and Phase 5 must use the provider Human Gate workflow.');
              return;
            }

            const { data: planFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'automation/phase-plan.json',
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(planFile) || planFile.type !== 'file' || !planFile.content) {
              core.setFailed('Trusted phase plan is unavailable.');
              return;
            }
            let plan;
            try {
              plan = JSON.parse(Buffer.from(planFile.content, 'base64').toString('utf8'));
            } catch (_) {
              core.setFailed('Trusted phase plan is invalid JSON.');
              return;
            }
            const phaseConfig = plan.phases?.find((item) => item.id === phase);
            if (
              plan.schema_version !== '1.0' ||
              phaseConfig?.label !== phase ||
              typeof phaseConfig.prompt !== 'string'
            ) {
              core.setFailed('Trusted current-phase configuration is invalid.');
              return;
            }

            const request = {
              schema_version: '1.0',
              action: 'IMPLEMENT_PHASE',
              trigger: 'HUMAN_RESUME',
              phase,
              head_sha: headSha,
              phase_prompt: phaseConfig.prompt,
              invariant_audit: plan.invariant_audit,
            };
            const marker = `<!-- redteam-implementation-request\n${JSON.stringify(request)}\n-->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            function exactKeys(value, expected) {
              return value && typeof value === 'object' && !Array.isArray(value) &&
                JSON.stringify(Object.keys(value).sort()) ===
                  JSON.stringify([...expected].sort());
            }
            async function isAncestor(ancestorSha, descendantSha) {
              if (ancestorSha === descendantSha) return true;
              const comparison = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                {owner, repo, basehead: `${ancestorSha}...${descendantSha}`}
              );
              return comparison.data.merge_base_commit?.sha === ancestorSha &&
                comparison.data.behind_by === 0 &&
                ['ahead', 'identical'].includes(comparison.data.status);
            }
            const gateKeys = [
              'schema_version', 'phase', 'reviewed_sha', 'base_sha', 'verdict',
              'summary', 'evidence_format', 'ready_reference',
              'review_trigger_reference', 'review_reference', 'reviewer_login',
              'recorded_by', 'finding_key', 'required_checks', 'loop_state',
            ];
            const designGateKeys = [
              ...gateKeys, 'stop_reason', 'recurring_families', 'finding_references',
            ];
            const gates = [];
            for (const comment of comments) {
              if (comment.user?.login !== 'github-actions[bot]') continue;
              for (const record of markerPayloads(comment.body, 'redteam-phase-gate')) {
                if (record.phase !== phase ||
                    !/^[0-9a-f]{40}$/.test(record.reviewed_sha || '') ||
                    !await isAncestor(record.reviewed_sha, headSha)) continue;
                const baseGate = exactKeys(record, gateKeys) &&
                  record.schema_version === '1.0';
                const designGate = exactKeys(record, designGateKeys) &&
                  record.schema_version === '1.1';
                if (!baseGate && !designGate) {
                  core.setFailed('Incorporated current-Phase gate is malformed.');
                  return;
                }
                gates.push({record, url: comment.html_url});
              }
            }
            const maximalGates = [];
            for (const candidate of gates) {
              let dominated = false;
              for (const other of gates) {
                if (candidate.record.reviewed_sha !== other.record.reviewed_sha &&
                    await isAncestor(
                      candidate.record.reviewed_sha, other.record.reviewed_sha
                    )) {
                  dominated = true;
                  break;
                }
              }
              if (!dominated) maximalGates.push(candidate);
            }
            if (maximalGates.length > 1) {
              core.setFailed('Latest incorporated current-Phase gate is ambiguous.');
              return;
            }
            const latestGate = maximalGates[0];
            if (latestGate?.record.verdict === 'CHANGES_REQUESTED' &&
                latestGate.record.loop_state === 'BLOCKED_LIMIT') {
              const familyKeys = [
                'schema_version', 'phase', 'reviewed_sha', 'review_reference',
                'verdict', 'families',
              ];
              const familyRecords = [];
              for (const comment of comments) {
                if (comment.user?.login !== 'github-actions[bot]') continue;
                for (const record of markerPayloads(
                  comment.body, 'redteam-invariant-family-review'
                )) {
                  if (record.phase !== phase) continue;
                  if (!exactKeys(record, familyKeys) || record.schema_version !== '1.0' ||
                      !/^[0-9a-f]{40}$/.test(record.reviewed_sha || '') ||
                      !Array.isArray(record.families) ||
                      record.families.length !== new Set(record.families).size ||
                      !record.families.every((item) =>
                        /^[a-z][a-z0-9-]{2,63}$/.test(item))) {
                    core.setFailed('Trusted invariant-family evidence is malformed.');
                    return;
                  }
                  familyRecords.push(record);
                }
              }
              const currentFamilies = familyRecords.filter((record) =>
                record.reviewed_sha === latestGate.record.reviewed_sha &&
                record.review_reference === latestGate.record.review_reference &&
                record.verdict === 'CHANGES_REQUESTED'
              );
              const currentFamilyIdentities = new Set(
                currentFamilies.map((record) => JSON.stringify(record))
              );
              if (currentFamilyIdentities.size > 1) {
                core.setFailed('Current invariant-family evidence is ambiguous.');
                return;
              }
              const recurring = new Set();
              if (currentFamilyIdentities.size === 1) {
                const currentSet = new Set(currentFamilies[0].families);
                for (const record of familyRecords) {
                  if (record.verdict !== 'CHANGES_REQUESTED' ||
                      record.reviewed_sha === latestGate.record.reviewed_sha ||
                      !await isAncestor(
                        record.reviewed_sha, latestGate.record.reviewed_sha
                      )) continue;
                  for (const family of record.families) {
                    if (currentSet.has(family)) recurring.add(family);
                  }
                }
              }
              if (latestGate.record.stop_reason === 'INVARIANT_FAMILY_RECURRENCE' ||
                  recurring.size > 0) {
                core.setFailed(
                  'DESIGN_CHANGE_REQUIRED rejects generic Resume AI Loop.'
                );
                return;
              }
            }
            const trustedDuplicate = comments.some(
              (item) => item.user?.login === 'github-actions[bot]' && item.body?.includes(marker)
            );
            if (!trustedDuplicate) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `AI loop resume authorized for \`${phase}\` at \`${headSha}\`. Resolution: ${resolutionSummary}\n\nEvidence: ${resolutionReference}\n\n${marker}`,
              });
            }
            try {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pull_number, name: 'ai-loop-blocked',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pull_number, labels: ['ai-needs-implementation'],
            });
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: 'pending',
              context: 'redteam/phase-review',
              description: `${phase}: human-authorized resume pending`.slice(0, 140),
            });
