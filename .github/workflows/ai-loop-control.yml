name: Record AI Phase Review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number
        required: true
        type: number
      phase:
        description: Phase reviewed on the pull request
        required: true
        type: choice
        options:
          - phase-0a
          - phase-0b
          - phase-0c
          - phase-1
          - phase-2
          - phase-3
          - phase-4
          - phase-5
      reviewed_sha:
        description: Exact 40-character PR head SHA independently reviewed
        required: true
        type: string
      base_sha:
        description: Exact phase base SHA used by the reviewer
        required: true
        type: string
      verdict:
        description: Independent review verdict
        required: true
        type: choice
        options:
          - PASS
          - CHANGES_REQUESTED
          - BLOCKED
      review_reference:
        description: Permalink to local-review result or historical native review evidence
        required: true
        type: string
      ready_reference:
        description: Permalink to the trusted current-head CI ready marker
        required: true
        type: string
      review_trigger_reference:
        description: Permalink to the launcher-authored exact-SHA local review start
        required: true
        type: string
      summary:
        description: Concise review summary (no secrets)
        required: true
        type: string
      finding_key:
        description: Stable root-cause key for CHANGES_REQUESTED, for example B-01
        required: false
        type: string
      confirmation:
        description: Type RECORD_PHASE_REVIEW
        required: true
        type: string

concurrency:
  group: redteam-review-record-${{ inputs.pull_request_number }}
  cancel-in-progress: false

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_GATE_APPROVER_LOGIN: ${{ vars.AI_GATE_APPROVER_LOGIN }}
      AI_LOOP_MAX_ITERATIONS: ${{ vars.AI_LOOP_MAX_ITERATIONS }}
      AI_REVIEWER_LOGIN: ${{ vars.AI_REVIEWER_LOGIN }}
      BASE_SHA: ${{ inputs.base_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      FINDING_KEY: ${{ inputs.finding_key }}
      PHASE: ${{ inputs.phase }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      READY_REFERENCE: ${{ inputs.ready_reference }}
      REVIEW_REFERENCE: ${{ inputs.review_reference }}
      REVIEW_TRIGGER_REFERENCE: ${{ inputs.review_trigger_reference }}
      SUMMARY: ${{ inputs.summary }}
      VERDICT: ${{ inputs.verdict }}
    steps:
      - name: Check out trusted workflow helpers
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate evidence and record phase result
        id: record
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const crypto = require('crypto');
            const loopControl = require(`${process.env.GITHUB_WORKSPACE}/automation/loop_control_state.js`);
            const localReview = require(`${process.env.GITHUB_WORKSPACE}/automation/local_review_evidence.js`);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number.parseInt(process.env.PR_NUMBER, 10);
            const phase = process.env.PHASE;
            const reviewedSha = process.env.REVIEWED_SHA.trim();
            const suppliedBaseSha = process.env.BASE_SHA.trim();
            const verdict = process.env.VERDICT;
            const reviewReference = process.env.REVIEW_REFERENCE.trim();
            const readyReference = process.env.READY_REFERENCE.trim();
            const reviewTriggerReference = process.env.REVIEW_TRIGGER_REFERENCE.trim();
            const summary = process.env.SUMMARY.trim();
            const findingKey = process.env.FINDING_KEY.trim();

            if (process.env.CONFIRMATION !== 'RECORD_PHASE_REVIEW') {
              core.setFailed('Confirmation text does not match.');
              return;
            }
            if (!process.env.AI_GATE_APPROVER_LOGIN) {
              core.setFailed('Repository variable AI_GATE_APPROVER_LOGIN is not configured.');
              return;
            }
            if (context.actor !== process.env.AI_GATE_APPROVER_LOGIN) {
              core.setFailed(`Untrusted phase-gate actor: ${context.actor}`);
              return;
            }
            if (!process.env.AI_REVIEWER_LOGIN) {
              core.setFailed('Repository variable AI_REVIEWER_LOGIN is not configured.');
              return;
            }
            if (!Number.isInteger(pull_number) || pull_number < 1) {
              core.setFailed('Pull request number is invalid.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(reviewedSha) || !/^[0-9a-f]{40}$/.test(suppliedBaseSha)) {
              core.setFailed('Reviewed SHA and base SHA must be lowercase 40-character Git SHAs.');
              return;
            }
            if (!summary || summary.length > 500 || summary.includes('-->')) {
              core.setFailed('Summary must be 1-500 characters and cannot contain an HTML marker terminator.');
              return;
            }
            if (verdict === 'CHANGES_REQUESTED' && !/^[A-Z0-9][A-Z0-9._-]{0,63}$/.test(findingKey)) {
              core.setFailed('CHANGES_REQUESTED requires a stable uppercase finding_key.');
              return;
            }
            if (verdict !== 'CHANGES_REQUESTED' && findingKey !== '') {
              core.setFailed('finding_key is only accepted for CHANGES_REQUESTED.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({owner, repo, pull_number});
            if (pr.state !== 'open') {
              core.setFailed('The pull request is not open.');
              return;
            }
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('Fork pull requests are not accepted by the AI loop.');
              return;
            }
            if (pr.head.sha !== reviewedSha) {
              core.setFailed(`Stale review SHA: ${reviewedSha}; current head: ${pr.head.sha}`);
              return;
            }
            const labels = pr.labels.map((item) => item.name);
            const phases = labels.filter((name) => /^phase-(0a|0b|0c|[1-5])$/.test(name));
            if (phases.length !== 1 || phases[0] !== phase) {
              core.setFailed(`Review phase does not match the PR phase: ${phase} vs ${phases.join(', ')}`);
              return;
            }

            const { data: planFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'automation/phase-plan.json',
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(planFile) || planFile.type !== 'file' || !planFile.content) {
              core.setFailed('Trusted phase plan is unavailable.');
              return;
            }
            let plan;
            try {
              plan = JSON.parse(Buffer.from(planFile.content, 'base64').toString('utf8'));
            } catch (_) {
              core.setFailed('Trusted phase plan is invalid JSON.');
              return;
            }
            const expectedPhaseIds = [
              'phase-0a', 'phase-0b', 'phase-0c', 'phase-1',
              'phase-2', 'phase-3', 'phase-4', 'phase-5',
            ];
            if (
              plan.schema_version !== '1.0' ||
              !Array.isArray(plan.phases) ||
              plan.phases.length !== expectedPhaseIds.length ||
              plan.phases.some((item, index) => item.id !== expectedPhaseIds[index])
            ) {
              core.setFailed('Trusted phase plan has an unsupported shape or phase order.');
              return;
            }
            const phaseIndex = plan.phases.findIndex((item) => item.id === phase);
            const {data: familyPolicyFile} = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'automation/invariant-families.json',
              ref: context.payload.repository.default_branch,
            });
            if (
              Array.isArray(familyPolicyFile) || familyPolicyFile.type !== 'file' ||
              !familyPolicyFile.content
            ) {
              core.setFailed('Trusted invariant-family policy is unavailable.');
              return;
            }
            let familyPolicy;
            try {
              familyPolicy = JSON.parse(
                Buffer.from(familyPolicyFile.content, 'base64').toString('utf8')
              );
            } catch (_) {
              core.setFailed('Trusted invariant-family policy is invalid JSON.');
              return;
            }
            const familyIds = (familyPolicy.families || []).map((item) => item.id);
            if (
              familyPolicy.schema_version !== '1.0' ||
              familyPolicy.semantic_recurrence_limit !== 2 ||
              familyIds.length !== 7 || new Set(familyIds).size !== familyIds.length ||
              !Array.isArray(familyPolicy.phases?.[phase]) ||
              familyPolicy.phases[phase].length < 1 ||
              !(familyPolicy.phases?.[phase] || []).every((item) => familyIds.includes(item))
            ) {
              core.setFailed('Trusted invariant-family policy has an unsupported shape.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const markerPattern = /<!--\s*redteam-phase-gate\s*([\s\S]*?)-->/;
            const priorRecords = [];
            for (const comment of comments) {
              if (comment.user?.login !== 'github-actions[bot]') continue;
              const match = comment.body?.match(markerPattern);
              if (!match) continue;
              try {
                const record = JSON.parse(match[1].trim());
                if (['1.0', '1.1'].includes(record.schema_version) &&
                    typeof comment.html_url === 'string') {
                  priorRecords.push({...record, _comment_url: comment.html_url});
                }
              } catch (_) {}
            }

            const ancestry = new Map();
            const phaseGateKeys = [
              'schema_version', 'phase', 'reviewed_sha', 'base_sha', 'verdict', 'summary',
              'evidence_format', 'ready_reference', 'review_trigger_reference',
              'review_reference', 'reviewer_login', 'recorded_by', 'finding_key',
              'required_checks', 'loop_state'
            ];
            function isExactPhaseGate(record) {
              return JSON.stringify(
                Object.keys(record).filter((key) => key !== '_comment_url').sort()
              ) === JSON.stringify([...phaseGateKeys].sort());
            }
            function hasPassingRequiredChecks(record) {
              return JSON.stringify(record.required_checks) === JSON.stringify([
                {name: 'tests (3.12)', status: 'PASS'},
                {name: 'tests (3.14)', status: 'PASS'},
                {name: 'quality', status: 'PASS'},
                {name: 'governance-integrity', status: 'PASS'},
              ]);
            }
            async function isAncestor(ancestorSha, descendantSha) {
              if (ancestorSha === descendantSha) return true;
              const key = `${ancestorSha}:${descendantSha}`;
              if (!ancestry.has(key)) {
                ancestry.set(key, (async () => {
                  const comparison = await github.request(
                    'GET /repos/{owner}/{repo}/compare/{basehead}',
                    {owner, repo, basehead: `${ancestorSha}...${descendantSha}`}
                  );
                  return comparison.data.merge_base_commit?.sha === ancestorSha &&
                    comparison.data.behind_by === 0 &&
                    ['ahead', 'identical'].includes(comparison.data.status);
                })());
              }
              return await ancestry.get(key);
            }

            let expectedBaseSha;
            if (phaseIndex === 0) {
              const refreshStatusDescription =
                'trusted exact-SHA base refresh authorization';
              const refreshStatusPattern =
                /^redteam\/base-refresh\/(phase-(?:0a|0b|0c|[1-5]))\/(phase-(?:0a|0b|0c|[1-5]))\/([0-9a-f]{40})$/;
              const refreshes = [];
              const phaseZeroPasses = priorRecords.filter((record) =>
                record.phase === 'phase-0a' && record.verdict === 'PASS' &&
                /^[0-9a-f]{40}$/.test(record.reviewed_sha)
              );
              for (const pass of phaseZeroPasses) {
                const statuses = await github.paginate(
                  github.rest.repos.listCommitStatusesForRef,
                  {owner, repo, ref: pass.reviewed_sha, per_page: 100}
                );
                for (const status of statuses) {
                  if (status.creator?.login !== 'github-actions[bot]' ||
                      !status.context?.startsWith('redteam/base-refresh/')) continue;
                  const match = status.context.match(refreshStatusPattern);
                  if (
                    !match || status.state !== 'success' ||
                    status.description !== refreshStatusDescription
                  ) {
                    core.setFailed('Trusted base-refresh status is malformed.');
                    return;
                  }
                  if (match[2] !== 'phase-0a') continue;
                  if (
                    match[1] !== 'phase-0b' ||
                    status.target_url !== pass._comment_url
                  ) {
                    core.setFailed('Phase 0A base-refresh status is not bound to its prior PASS.');
                    return;
                  }
                  refreshes.push({
                    from_phase: match[1],
                    revalidate_phase: match[2],
                    head_sha: pass.reviewed_sha,
                    target_base_sha: match[3],
                    prior_pass_reference: pass._comment_url,
                  });
                }
              }
              expectedBaseSha = pr.base.sha;
              if (refreshes.length > 0) {
                const uniqueRefreshes = [...new Map(
                  refreshes.map((refresh) => [JSON.stringify(refresh), refresh])
                ).values()];
                const incorporatedRefreshes = [];
                for (const refresh of uniqueRefreshes) {
                  const [oldHeadIsAncestor, targetBaseIsAncestor] = await Promise.all([
                    isAncestor(refresh.head_sha, reviewedSha),
                    isAncestor(refresh.target_base_sha, reviewedSha),
                  ]);
                  if (oldHeadIsAncestor && targetBaseIsAncestor) {
                    incorporatedRefreshes.push(refresh);
                  }
                }
                if (incorporatedRefreshes.length === 0) {
                  core.setFailed('Reviewed Phase 0A head is not descended from a trusted base refresh.');
                  return;
                }

                const maximalRefreshes = [];
                for (const candidate of incorporatedRefreshes) {
                  let dominated = false;
                  for (const other of incorporatedRefreshes) {
                    if (candidate === other) continue;
                    const strictlyAdvances = candidate.head_sha !== other.head_sha ||
                      candidate.target_base_sha !== other.target_base_sha;
                    if (strictlyAdvances &&
                        await isAncestor(candidate.head_sha, other.head_sha) &&
                        await isAncestor(candidate.target_base_sha, other.target_base_sha)) {
                      dominated = true;
                      break;
                    }
                  }
                  if (!dominated) maximalRefreshes.push(candidate);
                }
                if (maximalRefreshes.length !== 1) {
                  core.setFailed('Incorporated Phase 0A base-refresh evidence is ambiguous.');
                  return;
                }
                const matchedRefresh = maximalRefreshes[0];
                expectedBaseSha = matchedRefresh.target_base_sha;
              }
            } else {
              const previousPhase = plan.phases[phaseIndex - 1].id;
              const previousPassHeads = [...new Set(
                priorRecords.filter(
                  (record) => isExactPhaseGate(record) &&
                    record.phase === previousPhase &&
                    record.verdict === 'PASS' && record.loop_state === 'PASS' &&
                    localReview.isTrustedGateEvidence(
                      record, process.env.AI_REVIEWER_LOGIN, process.env.AI_GATE_APPROVER_LOGIN
                    ) &&
                    record.recorded_by === process.env.AI_GATE_APPROVER_LOGIN &&
                    record.finding_key === null && hasPassingRequiredChecks(record) &&
                    /^[0-9a-f]{40}$/.test(record.reviewed_sha)
                ).map((record) => record.reviewed_sha)
              )];
              const incorporatedPassHeads = [];
              for (const passHead of previousPassHeads) {
                if (await isAncestor(passHead, reviewedSha)) {
                  incorporatedPassHeads.push(passHead);
                }
              }
              if (incorporatedPassHeads.length === 0) {
                core.setFailed(
                  `No incorporated trusted PASS record exists for previous phase ${previousPhase}.`
                );
                return;
              }
              const maximalPassHeads = [];
              for (const candidate of incorporatedPassHeads) {
                let dominated = false;
                for (const other of incorporatedPassHeads) {
                  if (candidate !== other && await isAncestor(candidate, other)) {
                    dominated = true;
                    break;
                  }
                }
                if (!dominated) maximalPassHeads.push(candidate);
              }
              if (maximalPassHeads.length !== 1) {
                core.setFailed(
                  `Incorporated PASS evidence for previous phase ${previousPhase} is ambiguous.`
                );
                return;
              }
              expectedBaseSha = maximalPassHeads[0];
            }
            if (suppliedBaseSha !== expectedBaseSha) {
              core.setFailed(`Review base SHA mismatch: ${suppliedBaseSha}; expected: ${expectedBaseSha}`);
              return;
            }

            const requiredCheckNames = [
              'tests (3.12)',
              'tests (3.14)',
              'quality',
              'governance-integrity',
            ];
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: reviewedSha, filter: 'latest', per_page: 100,
            });
            const requiredChecks = [];
            for (const name of requiredCheckNames) {
              const run = checkRuns.find((item) => item.name === name && item.head_sha === reviewedSha);
              const status = run?.conclusion === 'success' ? 'PASS' : run ? 'FAIL' : 'MISSING';
              requiredChecks.push({name, status});
            }
            const nonPassing = requiredChecks.filter((item) => item.status !== 'PASS');
            if (nonPassing.length > 0) {
              core.setFailed(`Required checks are not successful: ${JSON.stringify(nonPassing)}`);
              return;
            }

            const expectedPrefix = `https://github.com/${owner}/${repo}/pull/${pull_number}`.toLowerCase();
            for (const [name, value] of [
              ['review_reference', reviewReference],
              ['ready_reference', readyReference],
              ['review_trigger_reference', reviewTriggerReference],
            ]) {
              if (!value.toLowerCase().startsWith(expectedPrefix)) {
                core.setFailed(`${name} must be a permalink on this pull request.`);
                return;
              }
            }

            function singleMarker(body, name) {
              const pattern = new RegExp(`<!--\\s*${name}\\s*([\\s\\S]*?)-->`, 'g');
              const matches = [...(body || '').matchAll(pattern)];
              if (matches.length !== 1) throw new Error(`${name} marker must occur exactly once.`);
              const raw = matches[0][1].trim();
              const keys = [...raw.matchAll(/"((?:\\.|[^"\\])*)"\\s*:/g)]
                .map((item) => JSON.parse(`"${item[1]}"`));
              if (new Set(keys).size !== keys.length) {
                throw new Error(`${name} marker contains a duplicate JSON key.`);
              }
              try {
                return JSON.parse(raw);
              } catch (_) {
                throw new Error(`${name} marker is not valid JSON.`);
              }
            }
            function exactKeys(value, expected) {
              return value && typeof value === 'object' && !Array.isArray(value) &&
                JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...expected].sort());
            }
            function parseTime(value, name) {
              const parsed = Date.parse(value || '');
              if (!Number.isFinite(parsed)) throw new Error(`${name} timestamp is invalid.`);
              return parsed;
            }
            function optionalMarker(body, name) {
              const pattern = new RegExp(`<!--\\s*${name}\\s*([\\s\\S]*?)-->`, 'g');
              const matches = [...(body || '').matchAll(pattern)];
              if (matches.length === 0) return null;
              if (matches.length !== 1) throw new Error(`${name} marker is ambiguous.`);
              try {
                return JSON.parse(matches[0][1].trim());
              } catch (_) {
                throw new Error(`${name} marker is not valid JSON.`);
              }
            }
            function canonicalJson(value) {
              if (Array.isArray(value)) return `[${value.map(canonicalJson).join(',')}]`;
              if (value && typeof value === 'object') {
                return `{${Object.keys(value).sort().map(
                  (key) => `${JSON.stringify(key)}:${canonicalJson(value[key])}`
                ).join(',')}}`;
              }
              return JSON.stringify(value);
            }

            const readyEvidence = comments.find((item) => item.html_url === readyReference);
            if (!readyEvidence || readyEvidence.user?.login !== 'github-actions[bot]') {
              core.setFailed('ready_reference is not a trusted github-actions[bot] comment.');
              return;
            }
            const readyMarker = singleMarker(readyEvidence.body, 'redteam-ready-for-review');
            if (
              !exactKeys(readyMarker, ['schema_version', 'phase', 'head_sha']) ||
              readyMarker.schema_version !== '1.0' || readyMarker.phase !== phase ||
              readyMarker.head_sha !== reviewedSha
            ) {
              core.setFailed('Ready marker is not exactly bound to the current phase and head.');
              return;
            }
            const invariantAudit = optionalMarker(
              readyEvidence.body, 'redteam-invariant-audit'
            );
            if (invariantAudit && (
              !exactKeys(invariantAudit, [
                'schema_version', 'phase', 'head_sha', 'audit_path', 'audit_digest',
                'request_reference',
              ]) ||
              invariantAudit.schema_version !== '1.0' || invariantAudit.phase !== phase ||
              invariantAudit.head_sha !== reviewedSha ||
              invariantAudit.audit_path !== `docs/review/${phase}-invariant-audit.json` ||
              !/^[0-9a-f]{64}$/.test(invariantAudit.audit_digest || '') ||
              !String(invariantAudit.request_reference || '').toLowerCase().startsWith(expectedPrefix)
            )) {
              core.setFailed('Invariant-audit marker is malformed or stale.');
              return;
            }
            if (invariantAudit) {
              const {data: auditFile} = await github.rest.repos.getContent({
                owner, repo, path: invariantAudit.audit_path, ref: reviewedSha,
              });
              if (Array.isArray(auditFile) || auditFile.type !== 'file' || !auditFile.content) {
                core.setFailed('Invariant-audit file is unavailable at the reviewed SHA.');
                return;
              }
              let auditData;
              try {
                auditData = JSON.parse(Buffer.from(auditFile.content, 'base64').toString('utf8'));
              } catch (_) {
                core.setFailed('Invariant-audit file is invalid JSON.');
                return;
              }
              const auditDigest = crypto.createHash('sha256')
                .update(canonicalJson(auditData)).digest('hex');
              if (auditDigest !== invariantAudit.audit_digest) {
                core.setFailed('Invariant-audit digest does not match the reviewed file.');
                return;
              }
              const requestEvidence = comments.find(
                (item) => item.html_url === invariantAudit.request_reference
              );
              const requestMatches = [...(requestEvidence?.body || '').matchAll(
                /<!--\s*redteam-implementation-request\s*([\s\S]*?)-->/g
              )];
              if (
                requestEvidence?.user?.login !== 'github-actions[bot]' ||
                requestMatches.length !== 1
              ) {
                core.setFailed('Invariant audit is not bound to one trusted implementation request.');
                return;
              }
              let requestPayload;
              try {
                requestPayload = JSON.parse(requestMatches[0][1].trim());
              } catch (_) {
                core.setFailed('Invariant-audit implementation request is invalid JSON.');
                return;
              }
              if (
                auditData.phase !== phase || auditData.request?.head_sha !== requestPayload.head_sha ||
                auditData.request?.action !== requestPayload.action ||
                auditData.request?.reference !== invariantAudit.request_reference ||
                requestPayload.phase !== phase ||
                !loopControl.hasRequiredImplementationStrategy(
                  auditData, requestPayload.invariant_audit
                ) ||
                JSON.stringify(requestPayload.invariant_audit || null) !==
                  JSON.stringify(plan.invariant_audit)
              ) {
                core.setFailed('Invariant audit does not match its trusted implementation request.');
                return;
              }
            }
            const readyTime = parseTime(readyEvidence.created_at, 'ready evidence');

            const triggerEvidence = comments.find(
              (item) => item.html_url === reviewTriggerReference
            );
            if (!triggerEvidence || triggerEvidence.user?.login !== process.env.AI_GATE_APPROVER_LOGIN) {
              core.setFailed('review_trigger_reference is not authored by the configured operator.');
              return;
            }
            const triggerBody = triggerEvidence.body || '';
            const localRoute = triggerBody.includes(localReview.START_MARKER);
            if (!localRoute) {
              core.setFailed('New phase gates require local-review-v1 evidence; native reviews are historical only.');
              return;
            }
            if (
              !localRoute && (triggerBody.split(/\r?\n/, 1)[0].trim() !== '@codex review' ||
              !triggerBody.includes(`\`${reviewedSha}\``) ||
              !triggerBody.includes(`\`${suppliedBaseSha}\``))
            ) {
              core.setFailed('Review trigger must use @codex review and contain both full SHAs.');
              return;
            }
            const source = invariantAudit ? {
              audit_digest: invariantAudit.audit_digest,
              audit_path: invariantAudit.audit_path,
              base_sha: suppliedBaseSha,
              head_sha: reviewedSha,
              phase,
              ready_url: readyReference,
              request_reference: invariantAudit.request_reference,
            } : {
              base_sha: suppliedBaseSha,
              head_sha: reviewedSha,
              phase,
              ready_url: readyReference,
            };
            const sourceDigest = crypto.createHash('sha256').update(JSON.stringify(source)).digest('hex');
            const triggerMarker = localRoute ? null :
              singleMarker(triggerBody, 'redteam-local-codex-trigger');
            if (
              !localRoute && (!exactKeys(triggerMarker, [
                'schema_version', 'kind', 'phase', 'head_sha', 'source_digest',
              ]) ||
              triggerMarker.schema_version !== '1.0' || triggerMarker.kind !== 'review' ||
              triggerMarker.phase !== phase || triggerMarker.head_sha !== reviewedSha ||
              triggerMarker.source_digest !== sourceDigest)
            ) {
              core.setFailed('Review trigger marker is not exactly bound to ready/head/base evidence.');
              return;
            }
            const triggerTime = parseTime(triggerEvidence.created_at, 'review trigger');
            if (triggerTime <= readyTime) {
              core.setFailed('Review trigger predates its current-head CI ready marker.');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number, per_page: 100,
            });
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number, per_page: 100,
            });
            const reactions = await github.paginate(github.rest.reactions.listForIssue, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            let localEvidence = null;
            let localPolicyDigest = null;
            if (localRoute) {
              if (!invariantAudit) {
                core.setFailed('Local review requires the current SHA-bound invariant audit.');
                return;
              }
              const {data: trustedDefault} = await github.rest.repos.getCommit({
                owner, repo, ref: context.payload.repository.default_branch,
              });
              if (context.ref !== `refs/heads/${context.payload.repository.default_branch}` ||
                  !/^[0-9a-f]{40}$/.test(context.sha || '') || trustedDefault.sha !== context.sha ||
                  pr.base.ref !== context.payload.repository.default_branch ||
                  !labels.includes('ai-loop') || labels.some((label) => [
                    'ai-loop-blocked', 'ai-human-gate', 'governance-change',
                    'ai-project-complete', 'ai-review-passed',
                  ].includes(label))) {
                core.setFailed('Local review requires current default-branch governance and active PR authority.');
                return;
              }
              const {data: policyFile} = await github.rest.repos.getContent({
                owner, repo, path: 'automation/local-execution-policy.json', ref: context.sha,
              });
              if (Array.isArray(policyFile) || policyFile.type !== 'file' || !policyFile.content) {
                core.setFailed('Trusted local execution policy is unavailable.');
                return;
              }
              const localPolicy = JSON.parse(Buffer.from(policyFile.content, 'base64').toString('utf8'));
              if (localPolicy.schema_version !== '1.0' || localPolicy.backend !== 'local-codex-cli' ||
                  localPolicy.cloud_fallback !== false || localPolicy.review_evidence_format !== 'local-review-v1' ||
                  localPolicy.review_requires_fresh_process !== true ||
                  localPolicy.review_requires_read_only !== true ||
                  localPolicy.worker_github_credentials !== false || localPolicy.unattended_review !== true) {
                core.setFailed('Local review execution policy does not enforce the approved trust boundary.');
                return;
              }
              localPolicyDigest = localReview.canonicalDigest(localPolicy);
              localEvidence = localReview.evaluateLocalReview({
                comments, timeline, startReference: reviewTriggerReference,
                reportReference: reviewReference, operatorLogin: process.env.AI_GATE_APPROVER_LOGIN,
                phase, headSha: reviewedSha, baseSha: suppliedBaseSha,
                readyReference, readyCreatedAt: readyEvidence.created_at, sourceDigest,
                policyDigest: localPolicyDigest,
                familyIds, requiredCheckNames, pullRequestUrl: `https://github.com/${owner}/${repo}/pull/${pull_number}`,
              });
            }
            const reviewEvidence = reviews.find((item) => item.html_url === reviewReference);
            const commentEvidence = comments.find((item) => item.html_url === reviewReference);
            const evidence = reviewEvidence || commentEvidence;
            if (!evidence) {
              core.setFailed('review_reference does not resolve to a PR review or issue comment.');
              return;
            }
            if (!localRoute && evidence.user?.login !== process.env.AI_REVIEWER_LOGIN) {
              core.setFailed(`Unexpected reviewer: ${evidence.user?.login || 'unknown'}`);
              return;
            }
            function codexPriority(body) {
              const matches = [...(body || '').matchAll(/!\[P([01]) Badge\]/g)];
              if (matches.length > 1) throw new Error('Codex finding has ambiguous priority badges.');
              return matches.length === 1 ? matches[0][1] : null;
            }
            function invariantFamily(body) {
              const matches = [...(body || '').matchAll(
                /^Invariant family: `([a-z][a-z0-9-]{2,63})`$/gm
              )];
              if (matches.length !== 1 || !familyIds.includes(matches[0][1])) {
                throw new Error(
                  'Codex finding must contain exactly one recognized Invariant family line.'
                );
              }
              return matches[0][1];
            }
            function nativeFindingKey(comment) {
              if (localRoute) return comment.finding_key;
              const priority = codexPriority(comment.body);
              if (!priority || typeof comment.path !== 'string' || !comment.path) {
                throw new Error('Codex finding is missing priority or path.');
              }
              const headline = (comment.body || '').split(/\r?\n/).map((line) => line.trim())
                .find((line) => line) || '';
              const digest = crypto.createHash('sha256')
                .update(`P${priority}\0${comment.path}\0${headline}`).digest('hex')
                .slice(0, 16).toUpperCase();
              return `CODEX-P${priority}-${digest}`;
            }
            function rejectSynchronize(start, end) {
              const changed = timeline.some((item) => item.event === 'synchronize' &&
                parseTime(item.created_at, 'synchronize event') > start &&
                parseTime(item.created_at, 'synchronize event') <= end);
              if (changed) throw new Error('PR head changed while Codex review was running.');
            }

            const currentFindings = localRoute ? localEvidence.currentFindings : reviewComments.filter((item) => {
              if (
                item.user?.login !== process.env.AI_REVIEWER_LOGIN ||
                item.commit_id !== reviewedSha
              ) return false;
              if (parseTime(item.created_at, 'Codex finding') <= triggerTime) return false;
              return codexPriority(item.body);
            }).sort((left, right) => left.id - right.id);
            const validReviews = new Map();
            for (const item of localRoute ? [] : reviews) {
              if (
                item.user?.login === process.env.AI_REVIEWER_LOGIN &&
                item.commit_id === reviewedSha && item.state === 'COMMENTED' &&
                parseTime(item.submitted_at, 'Codex review') > triggerTime
              ) validReviews.set(item.id, item);
            }
            for (const finding of currentFindings) {
              if (!localRoute && !validReviews.has(finding.pull_request_review_id)) {
                core.setFailed('Codex finding is not bound to a trusted current-head review.');
                return;
              }
              if (typeof finding.html_url !== 'string' || !finding.html_url) {
                core.setFailed('Codex finding is missing its permalink.');
                return;
              }
              invariantFamily(finding.body);
            }
            const currentFamilies = [...new Set(
              currentFindings.map((item) => invariantFamily(item.body))
            )].sort();
            const findingReviewIds = new Set(
              currentFindings.map((item) => item.pull_request_review_id)
            );
            if (
              !localRoute && (validReviews.size !== findingReviewIds.size ||
              [...validReviews.keys()].some((id) => !findingReviewIds.has(id)))
            ) {
              core.setFailed('Current-head Codex formal review is missing retained P0/P1 findings.');
              return;
            }
            if (validReviews.size > 1) {
              core.setFailed('Exhaustive Codex findings must be retained in one formal review.');
              return;
            }

            let expectedSummary;
            let completedTime;
            if (localRoute) {
              const expectedFindingKey = localEvidence.result.verdict === 'CHANGES_REQUESTED'
                ? currentFindings[0].finding_key : '';
              if (verdict !== localEvidence.result.verdict || findingKey !== expectedFindingKey) {
                core.setFailed('Local review verdict or finding key differs from its complete report.');
                return;
              }
              expectedSummary = localEvidence.result.summary;
              completedTime = localEvidence.completedTime;
            } else if (currentFindings.length > 0) {
              const owningReview = validReviews.get(currentFindings[0].pull_request_review_id);
              if (verdict !== 'CHANGES_REQUESTED' || reviewEvidence?.id !== owningReview.id) {
                core.setFailed('P0/P1 findings require their owning native review as evidence.');
                return;
              }
              const expectedFindingKey = nativeFindingKey(currentFindings[0]);
              if (findingKey !== expectedFindingKey) {
                core.setFailed(`Native finding key mismatch: ${findingKey}; expected ${expectedFindingKey}`);
                return;
              }
              expectedSummary = `Codex reported ${currentFindings.length} P0/P1 finding(s) for ${reviewedSha.slice(0, 10)}.`;
              completedTime = parseTime(owningReview.submitted_at, 'Codex review');
            } else {
              if (verdict !== 'PASS' || !commentEvidence || reviewEvidence) {
                core.setFailed('No-finding evidence must be a native Codex PASS comment.');
                return;
              }
              if (findingKey !== '') {
                core.setFailed('Native PASS evidence cannot contain a finding_key.');
                return;
              }
              const passBody = commentEvidence.body || '';
              const passPrefix = "Codex Review: Didn't find any major issues.";
              const commitMatches = [...passBody.matchAll(/^\*\*Reviewed commit:\*\* `([0-9a-f]{10,40})`$/gm)];
              if (
                !passBody.startsWith(passPrefix) || commitMatches.length !== 1 ||
                (passBody.match(/\*\*Reviewed commit:\*\*/g) || []).length !== 1 ||
                !reviewedSha.startsWith(commitMatches[0][1])
              ) {
                core.setFailed('Native Codex PASS comment has stale or ambiguous commit evidence.');
                return;
              }
              const passTime = parseTime(commentEvidence.created_at, 'Codex PASS comment');
              if (passTime <= triggerTime) {
                core.setFailed('Codex PASS comment predates the trusted trigger.');
                return;
              }
              const passReactions = reactions.filter((item) =>
                item.user?.login === process.env.AI_REVIEWER_LOGIN && item.content === '+1' &&
                parseTime(item.created_at, 'Codex reaction') >= passTime
              ).sort((left, right) => Date.parse(left.created_at) - Date.parse(right.created_at));
              if (passReactions.length === 0) {
                core.setFailed('Native Codex PASS is missing its reviewer thumbs-up reaction.');
                return;
              }
              expectedSummary = `Codex reported no P0/P1 findings for ${reviewedSha.slice(0, 10)}.`;
              completedTime = parseTime(passReactions[0].created_at, 'Codex reaction');
            }
            if (summary !== expectedSummary) {
              core.setFailed('Summary does not match the deterministically derived native review result.');
              return;
            }
            rejectSynchronize(triggerTime, completedTime);

            const maximum = Number.parseInt(process.env.AI_LOOP_MAX_ITERATIONS || '5', 10);
            if (maximum !== 5) {
              core.setFailed('AI_LOOP_MAX_ITERATIONS must be exactly 5.');
              return;
            }
            const priorChanges = priorRecords.filter(
              (record) => record.phase === phase && record.verdict === 'CHANGES_REQUESTED'
            );
            const sameFindingCount = priorChanges.filter(
              (record) => record.finding_key === findingKey
            ).length;
            const priorFamilyReviews = [];
            for (const comment of comments) {
              if (
                comment.user?.login !== 'github-actions[bot]' ||
                !(comment.body || '').includes('redteam-invariant-family-review')
              ) continue;
              const familyReview = optionalMarker(
                comment.body, 'redteam-invariant-family-review'
              );
              if (
                !exactKeys(familyReview, [
                  'schema_version', 'phase', 'reviewed_sha', 'review_reference',
                  'verdict', 'families',
                ]) || familyReview.schema_version !== '1.0' ||
                !expectedPhaseIds.includes(familyReview.phase) ||
                !/^[0-9a-f]{40}$/.test(familyReview.reviewed_sha || '') ||
                !String(familyReview.review_reference || '').toLowerCase().startsWith(expectedPrefix) ||
                !['PASS', 'CHANGES_REQUESTED'].includes(familyReview.verdict) ||
                !Array.isArray(familyReview.families) ||
                new Set(familyReview.families).size !== familyReview.families.length ||
                !familyReview.families.every((item) => familyIds.includes(item))
              ) {
                core.setFailed('Trusted invariant-family review marker is malformed.');
                return;
              }
              priorFamilyReviews.push(familyReview);
            }
            const recurringFamilies = currentFamilies.filter((family) =>
              priorFamilyReviews.some(
                (record) => record.phase === phase &&
                  record.reviewed_sha !== reviewedSha &&
                  record.verdict === 'CHANGES_REQUESTED' && record.families.includes(family)
              )
            );
            const designStop = verdict === 'CHANGES_REQUESTED' &&
              recurringFamilies.length > 0;
            const limitReached = verdict === 'CHANGES_REQUESTED' && (
              priorChanges.length + 1 >= maximum || sameFindingCount + 1 >= 5 || designStop
            );

            if (localRoute) {
              // Reports and model-emitted check statuses are not CI authority.
              // Re-read mutable evidence immediately before the gate write.
              const {data: currentDefault} = await github.rest.repos.getCommit({
                owner, repo, ref: context.payload.repository.default_branch,
              });
              const freshChecks = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: reviewedSha, filter: 'latest', per_page: 100,
              });
              if (currentDefault.sha !== context.sha || requiredCheckNames.some((name) => {
                const check = freshChecks.find((item) => item.name === name && item.head_sha === reviewedSha);
                return check?.conclusion !== 'success';
              })) {
                core.setFailed('Local review governance or current-HEAD checks changed before gate recording.');
                return;
              }
              const freshComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull_number, per_page: 100,
              });
              const freshTimeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number: pull_number, per_page: 100,
              });
              const freshReady = freshComments.filter((item) => item.html_url === readyReference);
              if (freshReady.length !== 1 || freshReady[0].body !== readyEvidence.body ||
                  freshReady[0].user?.login !== 'github-actions[bot]') {
                core.setFailed('Local review ready evidence changed before gate recording.');
                return;
              }
              const controlHistory = (items) => items.filter((item) =>
                item.user?.login === 'github-actions[bot]' &&
                ['redteam-phase-gate', 'redteam-invariant-family-review'].some(
                  (name) => (item.body || '').includes(name)
                )).map((item) => ({url: item.html_url, body: item.body}));
              if (localReview.canonicalDigest(controlHistory(freshComments)) !==
                  localReview.canonicalDigest(controlHistory(comments))) {
                core.setFailed('Local review phase or recurrence authority changed before gate recording.');
                return;
              }
              const freshReview = localReview.evaluateLocalReview({
                comments: freshComments, timeline: freshTimeline,
                startReference: reviewTriggerReference, reportReference: reviewReference,
                operatorLogin: process.env.AI_GATE_APPROVER_LOGIN,
                phase, headSha: reviewedSha, baseSha: suppliedBaseSha, readyReference,
                readyCreatedAt: readyEvidence.created_at, sourceDigest, policyDigest: localPolicyDigest,
                familyIds, requiredCheckNames, pullRequestUrl: `https://github.com/${owner}/${repo}/pull/${pull_number}`,
              });
              if (localReview.canonicalDigest(freshReview.report) !==
                  localReview.canonicalDigest(localEvidence.report)) {
                core.setFailed('Local review report changed before gate recording.');
                return;
              }
            }

            const { data: livePr } = await github.rest.pulls.get({owner, repo, pull_number});
            const livePhases = livePr.labels.map((item) => item.name)
              .filter((name) => /^phase-(0a|0b|0c|[1-5])$/.test(name));
            if (
              livePr.state !== 'open' || livePr.head.sha !== reviewedSha ||
              livePhases.length !== 1 || livePhases[0] !== phase
            ) {
              core.setFailed('Pull request head or phase changed before recording the gate.');
              return;
            }
            if (localRoute && (livePr.head.repo.full_name !== `${owner}/${repo}` ||
                livePr.base.ref !== context.payload.repository.default_branch ||
                !livePr.labels.some((item) => item.name === 'ai-loop') ||
                livePr.labels.some((item) => ['ai-loop-blocked', 'ai-human-gate',
                  'governance-change', 'ai-project-complete', 'ai-review-passed'].includes(item.name)))) {
              core.setFailed('Local review authority changed before gate recording.');
              return;
            }
            const record = {
              schema_version: designStop ? '1.1' : '1.0',
              phase,
              reviewed_sha: reviewedSha,
              base_sha: suppliedBaseSha,
              verdict,
              summary,
              evidence_format: localRoute ? 'local-review-v1' : 'codex-native-v1',
              review_reference: reviewReference,
              ready_reference: readyReference,
              review_trigger_reference: reviewTriggerReference,
              reviewer_login: localRoute ? process.env.AI_GATE_APPROVER_LOGIN : process.env.AI_REVIEWER_LOGIN,
              recorded_by: context.actor,
              finding_key: findingKey || null,
              required_checks: requiredChecks,
              loop_state: limitReached ? 'BLOCKED_LIMIT' : verdict,
            };
            if (designStop) {
              record.stop_reason = 'INVARIANT_FAMILY_RECURRENCE';
              record.recurring_families = [...recurringFamilies].sort();
              record.finding_references = currentFindings
                .map((item) => item.html_url).sort();
            }
            const marker = `<!-- redteam-phase-gate\n${JSON.stringify(record)}\n-->`;
            const familyReview = {
              schema_version: '1.0',
              phase,
              reviewed_sha: reviewedSha,
              review_reference: reviewReference,
              verdict,
              families: currentFamilies,
            };
            const familyMarker =
              `<!-- redteam-invariant-family-review\n${JSON.stringify(familyReview)}\n-->`;
            const { data: recordComment } = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: `Recorded independent review for \`${phase}\` at \`${reviewedSha}\`: **${verdict}**.\n\n${marker}\n\n${familyMarker}`,
            });

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({owner, repo, issue_number: pull_number, name});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            async function addLabels(names) {
              await github.rest.issues.addLabels({owner, repo, issue_number: pull_number, labels: names});
            }
            async function setReviewStatus(state, description) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: reviewedSha,
                state,
                context: 'redteam/phase-review',
                description: description.slice(0, 140),
                target_url: recordComment.html_url,
              });
            }

            await removeLabel('ai-needs-review');
            await removeLabel('ai-review-passed');

            if (verdict === 'BLOCKED' || limitReached) {
              await removeLabel('ai-needs-fix');
              await addLabels(['ai-loop-blocked']);
              const reason = designStop
                ? `semantic invariant family recurred: ${recurringFamilies.join(', ')}`
                : limitReached ? 'bounded retry limit reached' : 'independent review blocked';
              await setReviewStatus('error', `${phase}: ${reason}`);
              if (designStop) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull_number,
                  body: `AI loop stopped for design review: invariant family ${recurringFamilies.map(
                    (item) => `\`${item}\``
                  ).join(', ')} recurred in a second formal review. A new local patch and generic Resume are not authorized. Merge a coherent redesign, refresh this exact branch, and use the dedicated Approve AI Loop Design Resume workflow.`,
                });
              }
              return;
            }

            if (verdict === 'CHANGES_REQUESTED') {
              await removeLabel('ai-loop-blocked');
              await addLabels(['ai-needs-fix']);
              await setReviewStatus('failure', `${phase}: changes requested (${findingKey})`);
              const phaseConfig = plan.phases[phaseIndex];
              const request = {
                schema_version: '1.0',
                action: 'FIX_REVIEW_FINDINGS',
                trigger: 'REVIEW_FINDINGS',
                phase,
                head_sha: reviewedSha,
                phase_prompt: phaseConfig.prompt,
                invariant_audit: plan.invariant_audit,
                review: {
                  reviewed_sha: reviewedSha,
                  review_reference: reviewReference,
                  finding_key: findingKey,
                  finding_count: currentFindings.length,
                  findings: currentFindings.map((item) => ({
                    finding_key: nativeFindingKey(item),
                    finding_reference: item.html_url,
                    invariant_family: invariantFamily(item.body),
                  })),
                  summary,
                },
              };
              const requestMarker = `<!-- redteam-implementation-request\n${JSON.stringify(request)}\n-->`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `A bounded fix is required for all ${currentFindings.length} retained P0/P1 finding(s) in ${reviewReference}. \`${findingKey}\` is the retry key only. The local phase orchestrator will request the Codex fix from this trusted marker; the AI does not run inside GitHub Actions.\n\n${requestMarker}`,
              });
              return;
            }

            await removeLabel('ai-loop-blocked');
            await removeLabel('ai-needs-fix');
            await removeLabel('ai-needs-implementation');
            await addLabels(['ai-review-passed']);
            await setReviewStatus('success', `${phase}: independent review PASS`);

            const next = plan.phases[phaseIndex + 1];
            if (!next) {
              await addLabels(['ai-project-complete']);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `All configured phases passed at \`${reviewedSha}\`. The local orchestrator must independently revalidate the complete exact-SHA evidence chain before its single final merge attempt.`,
              });
              return;
            }

            if (next.auto_start !== true) {
              await addLabels(['ai-human-gate']);
              await setReviewStatus('pending', `${next.id}: human provider gate pending`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `Human Gate before \`${next.id}\`: ${next.human_gate_reason}\n\nApprove provider governance separately, then run **Advance AI Loop Phase**.`,
              });
              return;
            }

            const request = {
              schema_version: '1.0',
              action: 'IMPLEMENT_PHASE',
              trigger: 'PHASE_START',
              phase: next.id,
              head_sha: reviewedSha,
              phase_prompt: next.prompt,
              invariant_audit: plan.invariant_audit,
            };
            const requestMarker = `<!-- redteam-implementation-request\n${JSON.stringify(request)}\n-->`;
            const transition = {
              schema_version: '1.0',
              owner,
              repo,
              pull_number,
              reviewed_sha: reviewedSha,
              current_phase: phase,
              next_phase: next.label,
              request_body: `\`${phase}\` passed. The local phase orchestrator will request the Codex implementation for \`${next.id}\`; the AI does not run inside GitHub Actions.\n\n${requestMarker}`,
            };
            core.setOutput(
              'phase_transition',
              Buffer.from(JSON.stringify(transition), 'utf8').toString('base64url'),
            );
      - name: Perform marked adjacent-Phase transition
        if: ${{ steps.record.outputs.phase_transition != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REDTEAM_PHASE_TRANSITION: ${{ steps.record.outputs.phase_transition }}
        run: python automation/transition_phase.py
