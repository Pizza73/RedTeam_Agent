name: Record AI Phase Review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number
        required: true
        type: number
      phase:
        description: Phase reviewed on the pull request
        required: true
        type: choice
        options:
          - phase-0a
          - phase-0b
          - phase-0c
          - phase-1
          - phase-2
          - phase-3
          - phase-4
          - phase-5
      reviewed_sha:
        description: Exact 40-character PR head SHA reviewed by Codex Cloud or ChatGPT
        required: true
        type: string
      base_sha:
        description: Exact phase base SHA used by the reviewer
        required: true
        type: string
      verdict:
        description: Independent review verdict
        required: true
        type: choice
        options:
          - PASS
          - CHANGES_REQUESTED
          - BLOCKED
      review_reference:
        description: Permalink to the GitHub PR review or SHA-bound reviewer comment
        required: true
        type: string
      summary:
        description: Concise review summary (no secrets)
        required: true
        type: string
      finding_key:
        description: Stable root-cause key for CHANGES_REQUESTED, for example B-01
        required: false
        type: string
      confirmation:
        description: Type RECORD_PHASE_REVIEW
        required: true
        type: string

concurrency:
  group: redteam-review-record-${{ inputs.pull_request_number }}
  cancel-in-progress: false

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_GATE_APPROVER_LOGIN: ${{ vars.AI_GATE_APPROVER_LOGIN }}
      AI_LOOP_MAX_ITERATIONS: ${{ vars.AI_LOOP_MAX_ITERATIONS }}
      AI_REVIEWER_LOGIN: ${{ vars.AI_REVIEWER_LOGIN }}
      BASE_SHA: ${{ inputs.base_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      FINDING_KEY: ${{ inputs.finding_key }}
      PHASE: ${{ inputs.phase }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      REVIEW_REFERENCE: ${{ inputs.review_reference }}
      SUMMARY: ${{ inputs.summary }}
      VERDICT: ${{ inputs.verdict }}
    steps:
      - name: Validate evidence and record phase result
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number.parseInt(process.env.PR_NUMBER, 10);
            const phase = process.env.PHASE;
            const reviewedSha = process.env.REVIEWED_SHA.trim();
            const suppliedBaseSha = process.env.BASE_SHA.trim();
            const verdict = process.env.VERDICT;
            const reviewReference = process.env.REVIEW_REFERENCE.trim();
            const summary = process.env.SUMMARY.trim();
            const findingKey = process.env.FINDING_KEY.trim();

            if (process.env.CONFIRMATION !== 'RECORD_PHASE_REVIEW') {
              core.setFailed('Confirmation text does not match.');
              return;
            }
            if (!process.env.AI_GATE_APPROVER_LOGIN) {
              core.setFailed('Repository variable AI_GATE_APPROVER_LOGIN is not configured.');
              return;
            }
            if (context.actor !== process.env.AI_GATE_APPROVER_LOGIN) {
              core.setFailed(`Untrusted phase-gate actor: ${context.actor}`);
              return;
            }
            if (!process.env.AI_REVIEWER_LOGIN) {
              core.setFailed('Repository variable AI_REVIEWER_LOGIN is not configured.');
              return;
            }
            if (!Number.isInteger(pull_number) || pull_number < 1) {
              core.setFailed('Pull request number is invalid.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(reviewedSha) || !/^[0-9a-f]{40}$/.test(suppliedBaseSha)) {
              core.setFailed('Reviewed SHA and base SHA must be lowercase 40-character Git SHAs.');
              return;
            }
            if (!summary || summary.length > 500 || summary.includes('-->')) {
              core.setFailed('Summary must be 1-500 characters and cannot contain an HTML marker terminator.');
              return;
            }
            if (verdict === 'CHANGES_REQUESTED' && !/^[A-Z0-9][A-Z0-9._-]{0,63}$/.test(findingKey)) {
              core.setFailed('CHANGES_REQUESTED requires a stable uppercase finding_key.');
              return;
            }
            if (verdict !== 'CHANGES_REQUESTED' && findingKey !== '') {
              core.setFailed('finding_key is only accepted for CHANGES_REQUESTED.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({owner, repo, pull_number});
            if (pr.state !== 'open') {
              core.setFailed('The pull request is not open.');
              return;
            }
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('Fork pull requests are not accepted by the AI loop.');
              return;
            }
            if (pr.head.sha !== reviewedSha) {
              core.setFailed(`Stale review SHA: ${reviewedSha}; current head: ${pr.head.sha}`);
              return;
            }
            const labels = pr.labels.map((item) => item.name);
            const phases = labels.filter((name) => /^phase-(0a|0b|0c|[1-5])$/.test(name));
            if (phases.length !== 1 || phases[0] !== phase) {
              core.setFailed(`Review phase does not match the PR phase: ${phase} vs ${phases.join(', ')}`);
              return;
            }

            const { data: planFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'automation/phase-plan.json',
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(planFile) || planFile.type !== 'file' || !planFile.content) {
              core.setFailed('Trusted phase plan is unavailable.');
              return;
            }
            let plan;
            try {
              plan = JSON.parse(Buffer.from(planFile.content, 'base64').toString('utf8'));
            } catch (_) {
              core.setFailed('Trusted phase plan is invalid JSON.');
              return;
            }
            const expectedPhaseIds = [
              'phase-0a', 'phase-0b', 'phase-0c', 'phase-1',
              'phase-2', 'phase-3', 'phase-4', 'phase-5',
            ];
            if (
              plan.schema_version !== '1.0' ||
              !Array.isArray(plan.phases) ||
              plan.phases.length !== expectedPhaseIds.length ||
              plan.phases.some((item, index) => item.id !== expectedPhaseIds[index])
            ) {
              core.setFailed('Trusted phase plan has an unsupported shape or phase order.');
              return;
            }
            const phaseIndex = plan.phases.findIndex((item) => item.id === phase);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const markerPattern = /<!--\s*redteam-phase-gate\s*([\s\S]*?)-->/;
            const priorRecords = [];
            for (const comment of comments) {
              if (comment.user?.login !== 'github-actions[bot]') continue;
              const match = comment.body?.match(markerPattern);
              if (!match) continue;
              try {
                const record = JSON.parse(match[1].trim());
                if (record.schema_version === '1.0') priorRecords.push(record);
              } catch (_) {}
            }

            let expectedBaseSha;
            if (phaseIndex === 0) {
              expectedBaseSha = pr.base.sha;
            } else {
              const previousPhase = plan.phases[phaseIndex - 1].id;
              const previousPasses = priorRecords.filter(
                (record) => record.phase === previousPhase && record.verdict === 'PASS'
              );
              if (previousPasses.length === 0) {
                core.setFailed(`No trusted PASS record exists for previous phase ${previousPhase}.`);
                return;
              }
              expectedBaseSha = previousPasses.at(-1).reviewed_sha;
            }
            if (suppliedBaseSha !== expectedBaseSha) {
              core.setFailed(`Review base SHA mismatch: ${suppliedBaseSha}; expected: ${expectedBaseSha}`);
              return;
            }

            const requiredCheckNames = [
              'tests (3.12)',
              'tests (3.14)',
              'quality',
              'governance-integrity',
            ];
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: reviewedSha, filter: 'latest', per_page: 100,
            });
            const requiredChecks = [];
            for (const name of requiredCheckNames) {
              const run = checkRuns.find((item) => item.name === name && item.head_sha === reviewedSha);
              const status = run?.conclusion === 'success' ? 'PASS' : run ? 'FAIL' : 'MISSING';
              requiredChecks.push({name, status});
            }
            const nonPassing = requiredChecks.filter((item) => item.status !== 'PASS');
            if (nonPassing.length > 0) {
              core.setFailed(`Required checks are not successful: ${JSON.stringify(nonPassing)}`);
              return;
            }

            const expectedPrefix = `https://github.com/${owner}/${repo}/pull/${pull_number}`.toLowerCase();
            if (!reviewReference.toLowerCase().startsWith(expectedPrefix)) {
              core.setFailed('review_reference must be a permalink on this pull request.');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number, per_page: 100,
            });
            const reviewEvidence = reviews.find((item) => item.html_url === reviewReference);
            const commentEvidence = comments.find((item) => item.html_url === reviewReference);
            const evidence = reviewEvidence || commentEvidence;
            if (!evidence) {
              core.setFailed('review_reference does not resolve to a PR review or issue comment.');
              return;
            }
            if (evidence.user?.login !== process.env.AI_REVIEWER_LOGIN) {
              core.setFailed(`Unexpected reviewer: ${evidence.user?.login || 'unknown'}`);
              return;
            }
            if (reviewEvidence && reviewEvidence.commit_id !== reviewedSha) {
              core.setFailed('The referenced PR review is not bound to reviewed_sha.');
              return;
            }
            if (commentEvidence && !commentEvidence.body?.includes(reviewedSha)) {
              core.setFailed('The referenced reviewer comment does not contain reviewed_sha.');
              return;
            }

            const evidenceBody = evidence.body || '';
            const reviewMarkerPattern = /<!--\s*redteam-ai-review\s*([\s\S]*?)-->/g;
            const reviewMarkers = [...evidenceBody.matchAll(reviewMarkerPattern)];
            if (reviewMarkers.length !== 1) {
              core.setFailed('Review evidence must contain exactly one redteam-ai-review marker.');
              return;
            }
            let reviewerResult;
            try {
              reviewerResult = JSON.parse(reviewMarkers[0][1].trim());
            } catch (_) {
              core.setFailed('The redteam-ai-review marker is not valid JSON.');
              return;
            }
            const expectedReviewKeys = [
              'base_sha', 'findings', 'phase', 'required_checks', 'reviewed_sha',
              'schema_version', 'summary', 'verdict',
            ];
            const actualReviewKeys = Object.keys(reviewerResult).sort();
            if (JSON.stringify(actualReviewKeys) !== JSON.stringify(expectedReviewKeys)) {
              core.setFailed('The redteam-ai-review marker has missing or unknown fields.');
              return;
            }
            if (
              reviewerResult.schema_version !== '1.0' ||
              reviewerResult.phase !== phase ||
              reviewerResult.reviewed_sha !== reviewedSha ||
              reviewerResult.base_sha !== suppliedBaseSha ||
              reviewerResult.verdict !== verdict ||
              reviewerResult.summary !== summary ||
              !Array.isArray(reviewerResult.findings) ||
              !Array.isArray(reviewerResult.required_checks)
            ) {
              core.setFailed('Recorded inputs do not exactly match the independent review marker.');
              return;
            }
            if (verdict === 'PASS' && reviewerResult.findings.length !== 0) {
              core.setFailed('A PASS review cannot contain findings.');
              return;
            }
            const reviewerCheckNames = reviewerResult.required_checks.map((item) => item?.name);
            const reviewerChecksAreExact =
              reviewerResult.required_checks.length === requiredCheckNames.length &&
              new Set(reviewerCheckNames).size === requiredCheckNames.length &&
              requiredCheckNames.every((name) => reviewerCheckNames.includes(name)) &&
              reviewerResult.required_checks.every((item) => item?.status === 'PASS');
            if (!reviewerChecksAreExact) {
              core.setFailed('Reviewer result must report every required check exactly once as PASS.');
              return;
            }
            if (verdict === 'CHANGES_REQUESTED') {
              if (reviewerResult.findings.length === 0) {
                core.setFailed('CHANGES_REQUESTED must contain at least one review finding.');
                return;
              }
              const findingExists = reviewerResult.findings.some(
                (item) => item?.id === findingKey || item?.requirement_id === findingKey
              );
              if (!findingExists) {
                core.setFailed('finding_key must match a finding id or requirement_id in the review.');
                return;
              }
            }

            const maximum = Number.parseInt(process.env.AI_LOOP_MAX_ITERATIONS || '5', 10);
            if (!Number.isInteger(maximum) || maximum < 1 || maximum > 20) {
              core.setFailed('AI_LOOP_MAX_ITERATIONS must be an integer from 1 through 20.');
              return;
            }
            const priorChanges = priorRecords.filter(
              (record) => record.phase === phase && record.verdict === 'CHANGES_REQUESTED'
            );
            const sameFindingCount = priorChanges.filter(
              (record) => record.finding_key === findingKey
            ).length;
            const limitReached = verdict === 'CHANGES_REQUESTED' && (
              priorChanges.length + 1 >= maximum || sameFindingCount + 1 >= 3
            );

            const record = {
              schema_version: '1.0',
              phase,
              reviewed_sha: reviewedSha,
              base_sha: suppliedBaseSha,
              verdict,
              summary,
              review_reference: reviewReference,
              reviewer_login: process.env.AI_REVIEWER_LOGIN,
              recorded_by: context.actor,
              finding_key: findingKey || null,
              required_checks: requiredChecks,
              loop_state: limitReached ? 'BLOCKED_LIMIT' : verdict,
            };
            const marker = `<!-- redteam-phase-gate\n${JSON.stringify(record)}\n-->`;
            const { data: recordComment } = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: `Recorded independent review for \`${phase}\` at \`${reviewedSha}\`: **${verdict}**.\n\n${marker}`,
            });

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({owner, repo, issue_number: pull_number, name});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            async function addLabels(names) {
              await github.rest.issues.addLabels({owner, repo, issue_number: pull_number, labels: names});
            }
            async function setReviewStatus(state, description) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: reviewedSha,
                state,
                context: 'redteam/phase-review',
                description: description.slice(0, 140),
                target_url: recordComment.html_url,
              });
            }

            await removeLabel('ai-needs-review');
            await removeLabel('ai-review-passed');

            if (verdict === 'BLOCKED' || limitReached) {
              await removeLabel('ai-needs-fix');
              await addLabels(['ai-loop-blocked']);
              const reason = limitReached ? 'bounded retry limit reached' : 'independent review blocked';
              await setReviewStatus('error', `${phase}: ${reason}`);
              return;
            }

            if (verdict === 'CHANGES_REQUESTED') {
              await removeLabel('ai-loop-blocked');
              await addLabels(['ai-needs-fix']);
              await setReviewStatus('failure', `${phase}: changes requested (${findingKey})`);
              const phaseConfig = plan.phases[phaseIndex];
              const request = {
                schema_version: '1.0',
                action: 'FIX_REVIEW_FINDINGS',
                trigger: 'REVIEW_FINDINGS',
                phase,
                head_sha: reviewedSha,
                phase_prompt: phaseConfig.prompt,
                review: {
                  reviewed_sha: reviewedSha,
                  review_reference: reviewReference,
                  finding_key: findingKey,
                  summary,
                },
              };
              const requestMarker = `<!-- redteam-implementation-request\n${JSON.stringify(request)}\n-->`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `A bounded fix is required for \`${findingKey}\`. The local phase orchestrator will request the Codex fix from this trusted marker; the AI does not run inside GitHub Actions.\n\n${requestMarker}`,
              });
              return;
            }

            await removeLabel('ai-loop-blocked');
            await removeLabel('ai-needs-fix');
            await removeLabel('ai-needs-implementation');
            await addLabels(['ai-review-passed']);
            await setReviewStatus('success', `${phase}: independent review PASS`);

            const next = plan.phases[phaseIndex + 1];
            if (!next) {
              await addLabels(['ai-project-complete']);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `All configured phases passed at \`${reviewedSha}\`. Final human review and merge are still required.`,
              });
              return;
            }

            if (next.auto_start !== true) {
              await addLabels(['ai-human-gate']);
              await setReviewStatus('pending', `${next.id}: human provider gate pending`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `Human Gate before \`${next.id}\`: ${next.human_gate_reason}\n\nApprove provider governance separately, then run **Advance AI Loop Phase**.`,
              });
              return;
            }

            await removeLabel(phase);
            await removeLabel('ai-review-passed');
            await addLabels([next.label, 'ai-needs-implementation']);
            await setReviewStatus('pending', `${next.id}: implementation pending`);
            const request = {
              schema_version: '1.0',
              action: 'IMPLEMENT_PHASE',
              trigger: 'PHASE_START',
              phase: next.id,
              head_sha: reviewedSha,
              phase_prompt: next.prompt,
            };
            const requestMarker = `<!-- redteam-implementation-request\n${JSON.stringify(request)}\n-->`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: `\`${phase}\` passed. The local phase orchestrator will request the Codex implementation for \`${next.id}\`; the AI does not run inside GitHub Actions.\n\n${requestMarker}`,
            });
