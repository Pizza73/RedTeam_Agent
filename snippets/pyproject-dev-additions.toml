# Merge this into the existing pyproject.toml; do not duplicate an existing table.
# Resolve and pin exact versions in the project's committed lock file.

[project.optional-dependencies]
dev = [
  "coverage",
  "hypothesis",
  "mypy",
  "pytest",
  "ruff",
]

[tool.coverage.run]
branch = true
source = ["redteam_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["redteam_agent"]
